name: zenproxy
version: "0.7.0"
slug: zenproxy
description: Unifies one or more Zendure home battery devices behind a single virtual device API
url: https://github.com/jurriaanpro/zenproxy
arch:
  - amd64
startup: application
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: zenproxy HTTP API
options:
  virtual_sn: ZENPROXY000001
  virtual_product: "solarFlow800Plus"
  port: 8080
  devices:
    - host: 192.168.1.101
      port: 80
  leader_rotation_enabled: true
  leader_rotation_soc_delta_percent: 10.0
schema:
  virtual_sn: str
  virtual_product: str
  port: int
  devices:
    - host: str
      port: int
  leader_rotation_enabled: bool
  leader_rotation_soc_delta_percent: float
